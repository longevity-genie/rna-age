[project]
name = "rna-age"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anton Kulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cellxgene-census>=1.18.0",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
rna-age = "rna_age:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
