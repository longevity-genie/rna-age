# rna-age's seats (the seats kit, agent-seat-blueprints; docs/DECISIONS.md D1). Committed: it declares the seats
# and holds no key. The messenger accounts stay on each machine, in its pool.
[repo]
# Also the name of the repository's channel in the Zulip organisation, and the id the desk registers it under.
id = "rna-age"

# The lead (docs/seats/LEAD.md): owns docs/ROADMAP.md and builds it with the maintainers.
[seat.lead]
# The runner reports a run's end or a fault it cannot fix; the desk's secretary relays the maintainers' answers
# (a wake, never an instruction).
wake_from = "rna-age/runner */secretary"
# A person's post anywhere in the repository's channel wakes the lead, any topic, mention or not (Anton, 2026-11-11).
wake_people = "rna-age"

[seat.lead.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The plan's items that need the lead: no state or owner, a date come, a blocked item with no desk question, a
# desk question answered. Each said once.
[seat.lead.watch.plan]
cmd = "sh kit:bin/py.sh kit:classes/lead/plan-watch.py"

# The desk's answers to this seat's questions, each said once.
[seat.lead.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py rna-age lead"

# The key upstream's releases from the package index (duty upstream-index, held by the lead acting; kit L136, L143):
# TabICL, the single-cell clock (D7) and the base of RM30's expression-episode model.
[seat.lead.watch.upstream-index]
# --upstream once the pinned kit carries L143; this repository has no [on_publish], so nothing runs on a release.
cmd = "sh kit:bin/py.sh kit:drivers/pypi/watch-pypi.py tabicl"

# The runner (docs/seats/RUNNER.md): keeps the pipeline's jobs running on the cluster, logs each run.
[seat.runner]
# The lead hands it runs; the organisation's rigger says a share or a cluster fact changed; the desk's secretary
# relays the maintainers' answers.
wake_from = "rna-age/lead desk-antonkulaga/rigger */secretary"
# A quiet seat: it works whether the maintainers are there or not, its questions on the desk.
presence = false

[seat.runner.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The desk's answers to this seat's questions, each said once.
[seat.runner.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py rna-age runner"

# All of the runner's jobs (rna-age-*): start, requeue, end with its state and log; a restart says what ended
# meanwhile. Replaces the watch the runner armed after each sbatch (kit v0.1.182).
[seat.runner.watch.jobs]
cmd = "bash kit:drivers/slurm/watch-jobs.sh"

# The cluster's queue at every start: this repository's jobs by job_prefix; off the cluster it says the queue is
# unread. The partition and the account are the cluster machine's, never this file's.
[slurm]
job_prefix = "rna-age-"   # slurm/submit.sh names every job rna-age-<name>

# bash, not sh: the script needs bash 4.4 and refuses under a POSIX sh.
[digest.jobs]
cmd = "bash kit:drivers/slurm/digest-jobs.sh"
pinned = true
